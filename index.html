<h2>1. Introduction and Construction Philosophy in Timber Architecture</h2>
<p>Classical Japanese architecture, celebrated worldwide for the majesty of its Buddhist temples, Shinto shrines and three- and five-storey pagodas, is one of the supreme expressions of symbiosis between structural engineering and aesthetic sensibility. Unlike the Western and Chinese building traditions, historically oriented towards stone, brick and masonry thanks to the greater availability of clay and rock quarries, Japan steered its architectural evolution almost exclusively towards wood. This choice was not dictated solely by the vast abundance of top-quality coniferous forests — among which the Japanese cypress (hinoki) and the zelkova (keyaki) stand out — but also answered precise geological and climatic needs.</p>
<p>On the Japanese islands, constantly exposed to strong monsoon winds, typhoons and an extremely violent seismic regime, rigid masonry structures tend to suffer brittle fractures and disastrous collapses. Wood, by contrast, combines an intrinsic lightness with extraordinary flexibility. Traditional Japanese architecture learned to exploit this property by turning the building into an elastic organism: the structure does not rigidly oppose seismic forces but dissipates them progressively through controlled movement, the internal friction generated by the components sliding against one another in the nodes, and the damping action of the joints. Moreover, from a microclimatic point of view, wood ensures optimal moisture management and thermal insulation compared with synthetic materials or concrete, guaranteeing a millennia-long durability to architectural masterpieces such as the celebrated Hōryū-ji temple.</p>
<p>Behind the formal purity and apparent simplicity of the lines of these buildings lies a formidable geometric and mechanical complexity, the fruit of knowledge accumulated over the centuries by master carpenters, known as daiku. In the Japanese tradition, the daiku was not simply a manual executor: in skills and responsibilities he resembled a true architect and engineer. This knowledge was jealously guarded within guilds and family corporations, marked by rigid professional secrets and a strong historical rivalry, such as the one between the traditional schools of Kyoto and Edo.</p>
<p>An aspect of deep cultural affinity lies in the spiritual respect reserved for the raw material: work tools, called dogu, were used in the belief of honouring the “spirit of the tree” (kodama). The technological evolution of the tools — from the prevalent use of axes and chisels to the introduction of the plane — always favoured hand tools designed to cut on the pull stroke, allowing masters to achieve millimetric precision. At the design level, the entire building system was based on the principle of kiwari, the set of proportions codified in historical manuals such as the Shōmei, which geometrically correlated every structural element (posts, bays, ceilings and roofs) on the basis of the fundamental module of the ken and on respect for the empty space or defined interval known as ma.</p>
<h2>2. The Classification of Joints: Tsugite and Shiguchi</h2>
<p>In the immense repertoire of traditional Japanese carpentry, the study of connections is fundamentally divided into two large functional categories:</p>
<ul>
<li>The tsugite, which are lengthening or splice joints, used to join horizontal or vertical elements end to end (as in the case of foundation sills or long beams).</li>
<li>The shiguchi, that is, the angular, T-shaped or cross-shaped connection joints, used to intersect posts, lintels and eave braces.</li>
</ul>
<p>Historically, this technical evolution received two major impulses: the first during the Yayoi period, with the introduction of iron tools that made it possible to build tall timber structures; the second during the Asuka period, with the arrival of Buddhism from the Asian continent and the introduction of advanced jointing and bracket techniques.</p>
<h3>A. Lengthening Joints</h3>
<p>The horizontal lengthening joints for sills and beams (bari / keta) show a highly refined mechanical engineering, designed to resist tension, bending and shear without the use of metal elements. Among the most significant models analysed in the historical treatises are:</p>
<ul>
<li><strong>The stepped dovetail joint (Koshikake aritsugi):</strong> Used mainly for foundation sills of standard square sections (from 105 mm to 120 mm), it involves cutting the ends to half depth in a dovetail shape that allows quick assembly by simple vertical sliding, although its intrinsic tensile strength remains moderate.</li>
<li><strong>The goose-neck joint (Koshikake kamatsugi):</strong> Designed for larger timber sections (from 150 mm to 200 mm), it offers markedly superior mechanical performance. Laboratory tests have shown that this type of joint can withstand considerable tensile loads before failing by compression or shear of the ribs, thanks to its characteristic shaped form that prevents axial pull-out.</li>
<li><strong>The sawtooth and planed scarf joints (Okkake daisen tsugi and Kanawa tsugi):</strong> They represent structural excellence for beams and sills subjected to extreme stresses. Symmetrical and locked by tension pins (komisen), these joints allow a structural element to be inserted or replaced even between fixed supports without complex axial movements, reaching very high tensile breaking loads (up to 6000 kg in tests on black pine).</li>
<li><strong>The hidden and decorative joints (Kakushi tsugi):</strong> Aesthetically clean solutions in which the external joint line appears as a simple continuous straight line, used both on exposed structural elements and on finishes and ceilings, relying on locking keys (shachi), blind pins (hako sen) and post pegs (saetsugi).</li>
<li><strong>The special column joints (Hashira tsugi):</strong> A category that includes the complex four-sided joints with diagonal goose-neck cuts, the shell-shaped joints (kai no guchi) reserved for elements of the highest value such as the central pillar of a pagoda (often reinforced with rings and carefully polished) and the celebrated joint of the Otemon gate of Osaka Castle, whose external mountain-range geometry has even been studied through X-ray analysis to reveal the millimetric perfection of its gap-free internal joints.</li>
</ul>
<h3>B. Angular and Structural Connection Joints</h3>
<p>The nodes where pillars, lintels and eave braces converge define the three-dimensional stability of the building:</p>
<ul>
<li><strong>Connections for foundation sills (Dodal shiguchi):</strong> They include the housed dovetail joint (ari otoshi), the shouldered tenon (kone hozo sashi) and the mitred corner joint (samitome hozo sashi). They are designed so that, should the softwood sill shrink or deteriorate over time, the hardwood pillar above it still keeps absolute stability thanks to calibrated tenons and locking wedges (kusabi).</li>
<li><strong>Roofing and roof systems (Kyoro and Orioku):</strong> They govern the intersection of eaves, arched beams (hari) and rafters, requiring rigorous geometric and stereotomic calculations. In this regard, one of the most fascinating historical curiosities described in the treatises is the on-site use of the “rainbow board” (hikari ita), a traditional marking tool used by carpenters to project and transfer with millimetric precision the roof pitches and complex geometric levels directly onto the rough timber.</li>
<li><strong>Corner joints for hips and ridges (Yosemune no sumi):</strong> Developed through geometric formulas and orthogonal projections for cutting corner stubs and false rafters, ensuring the perfect synchronisation of the eave pitches (5 sun pitch).</li>
<li><strong>Multiple and through-pin systems (double and triple pins):</strong> Techniques of great refinement for intersecting several orthogonal beams within the same through-column, tightened by keys and retaining pegs that distribute mechanical stresses without weakening the bearing section of the central pillar.</li>
</ul>
</template>
<template id="art-oo2">
<h2>3. Technological Curiosities: The Yakisugi Treatment (Shou Sugi Ban) and Historical Tools</h2>
<p>Among the most fascinating peculiarities of Japanese building culture, special mention goes to the Yakisugi technique (literally “burnt cedar”), universally known in the West as Shou Sugi Ban. It is not a simple decorative smoking, but a true superficial carbonisation of the wood (usually cedar or cypress) carried out by direct application of a live flame. This process destroys the sugars and the surface cellulose, leaving a protective layer of pure carbon that gives the material extraordinary properties:</p>
<ul>
<li><strong>Water repellency:</strong> Water can no longer penetrate the sealed pores.</li>
<li><strong>Biological resistance:</strong> Fungi, mould and wood-boring insects find no nourishment in the carbonised layer.</li>
<li><strong>Resistance to fire and UV rays:</strong> The carbonised crust acts as a thermal shield that drastically slows the ignition of flames and prevents solar degradation.</li>
</ul>
<p>This technique spread widely in the coastal and island areas of Japan (such as Setouchi or Kyushu) to protect buildings from salt spray and the very high levels of summer humidity, guaranteeing a service life of decades without the need for chemical maintenance treatments.</p>
<p>A stimulating historical question concerns why Venice — although sharing with Japan the constant exposure to a humid, brackish, lagoon environment — never adopted charred wood for its urban façades. The answer lies in profound geological, structural and historical differences:</p>
<ol>
<li><strong>The nature of the moisture:</strong> In Venice the main threat is the capillary rise of brackish water from the foundations and canals, a phenomenon that would have quickly rotted any timber cladding regularly immersed in the tide. For this reason the Venetians chose Istrian stone as the material of choice for the parts in direct contact with water, using it as a waterproof plinth.</li>
<li><strong>The role of wood in Venice:</strong> Wood in the Serenissima was widely used, but “underwater” — driven into the anoxic mud (caranto) as the foundation of the palaces —, where the total absence of oxygen prevents the bacteria of decay from attacking it. In the open air, wood on façades was strictly avoided to ward off the devastating danger of fires in densely populated urban areas.</li>
<li><strong>The choice of masonry and breathable plasters:</strong> Following repeated historical fires, Venice imposed the use of fired bricks and protective mortars, developing innovative technologies such as Marmorino and Cocciopesto (mixtures of lime with marble powder or ground brick) capable of letting walls “breathe” and expel moisture as vapour without degrading.</li>
</ol>
<p>Completing the picture of the historical tools described in the treatises are the traditional water level (mizu-hakarizao), a wooden instrument between two and six feet long with a central cavity into which water was poured to establish a perfect horizontal plane on the basis of the symmetrical overflow at the sides (used together with reference posts), and the jointing apparatus of the gable boards called Ogami (whose name visually evokes hands joined in prayer), reinforced with cross rails to prevent structural openings caused by thermal and climatic swings.</p>
<h2>4. Comparative Analysis: Traditional Eastern Carpentry vs Western Engineering</h2>
<p>The comparison between traditional Eastern building methods (based on dry jointing and three-dimensional geometry) and the Western tradition (evolved from stone to masonry, through nailed timber framing up to the modern engineering of steel and reinforced concrete) outlines two profoundly different engineering philosophies.</p>
<h3>A. Mechanical Behaviour and Seismic Response</h3>
<ul>
<li><strong>Eastern Tradition:</strong> The nodes (shiguchi and tsugite) are designed to do without metal elements, relying on geometric joints, wooden wedges (kusabi) and tension pins (komisen). The structure acts as a flexible organism capable of dissipating seismic energy through controlled micro-movement and internal friction.</li>
<li><strong>Western Tradition:</strong> Historically founded on rigid connections (initially wooden pegs and nails, then evolved into steel plates, bolts, braces and epoxy resins). In contemporary construction, the use of engineered wood (such as glulam or CLT) combined with metal connectors guarantees an extremely rigid behaviour that can be calculated according to rigorous regulatory standards (Eurocodes), although connections that are too rigid can concentrate stresses at focal points in the absence of adequate dissipation devices.</li>
</ul>
<h3>B. Raw Material Efficiency and Processing Waste</h3>
<ul>
<li><strong>Eastern Tradition:</strong> It involves a considerable waste of raw material during processing. Making complex three-dimensional cuts requires starting from very generous timber sections, partially reducing the net resisting section of the beam at the critical nodal points.</li>
<li><strong>Western Tradition:</strong> It optimises the raw material to a high degree. By using glued laminated elements and external or concealed connectors, there is no need to weaken the beam with deep cuts; the section is sized exactly according to the calculated static loads.</li>
</ul>
<h3>C. Economic Aspects, Maintenance and Geometric Versatility</h3>
<ul>
<li><strong>Costs and Maintenance:</strong> A traditional Japanese structure made entirely by hand by master carpenters entails very high labour costs (comparable to works of haute couture), but boasts extraordinary longevity and almost no structural maintenance if protected by wide eaves, since the wood “breathes” and settles by itself. By contrast, Western industrialised construction benefits from contained costs thanks to the use of numerically controlled machines and prefabrication, while requiring periodic checks on metal bolting subject to oxidation or to the shrinkage movements of the wood.</li>
<li><strong>Formal Versatility:</strong> Modern Western engineering dominates in terms of long spans and free geometries (thanks to cantilevers, double curvature and organic roofs made possible by steel and CLT), while the Eastern system excels in modular precision at the domestic scale and in the extraordinary ability to allow the complete disassembly and relocation of entire historic buildings.</li>
</ul>
<h2>5. The Reception and Influence of Eastern Techniques in Italy</h2>
<p>In the Italian and European architectural landscape, historically characterised by a building tradition based on stone, brick and hydraulic binders (from Roman lime to concrete), the introduction of such advanced Eastern techniques responds to motivations and contexts different from those of the Land of the Rising Sun. Nevertheless, in recent decades there has been a growing integration of these building philosophies, driven by two key factors: the pursuit of environmental sustainability (zero-impact green building, absence of chemical glues and ease of disassembly) and the aesthetic appeal of the philosophical principle of Wabi-Sabi, which values the natural ageing of matter.</p>
<ul>
<li><strong>Applications of Burnt Wood (Yakisugi / Shou Sugi Ban):</strong> This technique has found considerable diffusion in Italy, especially in alpine contexts (such as residences and chalets in the Susa Valley) and in hilly or maritime areas (for example in villas and installations at the foot of Etna, where the black carbonised wood dialogues chromatically with the local lava stone). Thanks to modern ventilated façades, which allow the treated panel to be spaced from the load-bearing wall by an air cavity, it is possible to exploit the hydrophobic and anti-parasitic properties of burnt wood in compliance with the building and fire regulations in force.</li>
<li><strong>Structural Joints and Traditional Carpentry (Kigumi / Sashimono):</strong> Although the construction of permanent buildings based entirely on millimetric joints without steel meets considerable regulatory obstacles in Europe because of the rigorous seismic and calculation standards (Eurocodes), the technique survives and is valued through temporary exhibition pavilions, installations for design fairs (such as the workshops led by Japanese master shipwrights in collaboration with universities and designers in Milan) and in the restoration of interior furnishings, sliding walls (shoji and fusuma) or tea ceremony pavilions within private residences and Zen gardens.</li>
</ul>

<p>In recent years, the urgent need to reduce CO<sub>2</sub> emissions and energy consumption in the construction sector—responsible for approximately 40% of energy use and 36% of emissions in the European Union—has driven scientific research toward increasingly efficient, adaptable, and multifunctional building envelope solutions. By combining textile material science, building physics, and the microstructures of electrospun polymers, an integrated vision of the building envelope emerges: no longer understood as a mere passive barrier, but as a dynamic and reactive system capable of filtering air, exchanging heat, and improving existing structures. This evolution stems from the synthesis and convergence of three fundamental scientific pillars: the retrofitting of facades via textile membranes, the operation of air-permeable building envelopes (APBEs) for ventilation and heat recovery, and the development of composite electrospun polymer membranes with ultra-high air filtration efficiency.</p>
<p>The starting point of this transformation lies in the renovation of the European building stock, where over 70% of buildings are energy-inefficient and about 35% are more than 50 years old. Conventional renovation strategies often encounter insurmountable barriers related to high costs, lengthy construction times, heavy structural impacts, and severe disruptions for occupants. To overcome these limits, textile membranes and polymeric films (such as PES-PVC, PTFE-glass, or ETFE) offer a lightweight, flexible, quickly assembled alternative with a low structural impact. Within the intervention categories known as Replace, Add-in, Wrap-it, Add-on, and Cover-it, the use of textiles is best expressed through Wrapping (enveloping the building), Double Skin (double skin on a single facade), and Covering (shading or partial cladding) strategies. These configurations allow for the creation of a thermal buffer zone—a ventilated or sealed air gap that breaks thermal bridges and improves facade resistance—while integrating shading devices that reduce summer heat loads without penalizing natural lighting.</p>
<p>Pushing the concept of the facade beyond simple external protection, building physics merges with thermodynamics through Air-Permeable Building Envelopes (APBEs), also known as dynamic insulation or breathing walls. Unlike traditional insulation systems designed to be airtight, an APBE utilizes a slow and controlled airflow passing through the porous matrix of the insulation to directly modify the thermal profile of the wall. In the infiltration mode (typical of the heating season), cold outdoor air is drawn inward through the porous insulation; in doing so, the heat that would normally be lost by conduction is recovered by the passing airflow, preheating the fresh supply air and bringing the equivalent U-value of the envelope down to near-zero levels (as low as 0.1 W/(m²·K)). Conversely, in the exfiltration mode (ideal for the cooling season), stale air extracted from conditioned spaces is pushed outward through the wall, blocking external heat gains and keeping the interior surface temperature close to the ambient air temperature, greatly benefiting radiant hygrothermal comfort.</p>
<p>Choose where the openings are, switch on the fibreglass non-woven membrane over the inlet and watch where the particles go: the ones that are caught stay on the membrane, while the cleaned air follows the flow of natural ventilation.</p>

<template id="air-b">
<p>For these dynamic and permeable systems to operate optimally—preventing moisture issues while ensuring excellent indoor air quality (IAQ)—the choice of the porous filtering material plays a strategic role. The most innovative response comes from far-field electrospinning technology, which allows for the fabrication of nanofibrous membranes characterized by high porosity, a large specific surface area, and sub-micrometric pore sizes. In particular, the development of a three-layer sandwich structure based on PVDF and Pullulan (PUL) represents a breakthrough: Pullulan—a natural, ecological, non-toxic polysaccharide biopolymer—forms the inner layer with ultra-thin nanofibers (average diameter of 180 nm) and pores reduced to about 480 nm, optimized for mechanical particulate interception. The outer layers made of polyvinylidene fluoride (PVDF), a polymer renowned for its exceptional mechanical and thermal stability, impart a pronounced hydrophobicity to the membrane (with a water contact angle reaching 131° for pure PVDF and 117° for the composite).</p>
<p>The resulting composite material delivers exceptional performance:</p>
<ul>
<li><strong>Filtration Efficiency:</strong> The membrane achieves 99.96% efficiency on PM<sub>2.5</sub> particulate matter, exceeding 98.5% for PM<sub>1.0</sub> and PM<sub>0.5</sub> as well.</li>
<li><strong>Air Permeability:</strong> Despite such powerful filtration capabilities, the pressure drop is limited to just 39 Pa (at a flow rate of 1 L/min), ensuring high breathability and an excellent Quality Factor.</li>
<li><strong>Resistance and Protection:</strong> The outer PVDF layer shields the structure from environmental loads and moisture, allowing the system to stably adapt to complex climatic contexts.</li>
</ul>

<p>In summary, the synergistic interaction between textile facade membranes, the thermodynamics of dynamic permeable envelopes, and advanced PVDF/PUL nanofiltration outlines a new generation of buildings. The result is an intelligent building envelope that combines the aesthetics and flexibility of textile design with active energy recovery and air purification, transforming the facade into a truly reactive, sustainable organism capable of effectively responding to ecological transition challenges.</p>

function ctl(id,label,min,max,step,val,unit){return `<div class="ctl"><label for="${id}">${label}<output id="${id}o">${val}${unit}</output></label><input type="range" id="${id}" min="${min}" max="${max}" step="${step}" value="${val}" data-unit="${unit}"></div>`}
function bind(el,fn){const run=()=>{el.querySelectorAll('input[type=range]').forEach(i=>{el.querySelector('#'+i.id+'o').textContent=i.value+i.dataset.unit});fn(k=>+el.querySelector('#'+k).value,k=>el.querySelector('#'+k))};el.addEventListener('input',run);run()}

let dotPlayed=false;
function introDot(skip){
 const h1=document.querySelector('.intro h1'),dot=h1&&h1.querySelector('.dot');if(!dot)return;
 const L=[...h1.querySelectorAll('.l')],last=L[L.length-1];let done=false;
 const m=()=>{const fs=parseFloat(getComputedStyle(h1).fontSize),D=dot.offsetWidth;return{pad:parseFloat(getComputedStyle(h1).paddingLeft),gc:i=>L[i].offsetLeft+(L[i].offsetWidth-.35*fs)/2-D/2,tp:i=>L[i].offsetTop+.2*fs-D*(1+.5)/2,yc:L[0].offsetTop+(L[0].offsetHeight-D)/2,ex:last.offsetLeft+last.offsetWidth+.2*fs}};
 const rest=()=>{dot.style.opacity=1;h1.style.transition='none';h1.style.paddingLeft='0px';const q=m();dot.style.transform=`translate(${q.ex}px,${q.yc}px)`};
 window.addEventListener('resize',()=>{if(h1.isConnected&&done)rest()});
 if(skip||matchMedia('(prefers-reduced-motion: reduce)').matches){dotPlayed=true;done=true;rest();return}
 dotPlayed=true;
 document.fonts.ready.then(()=>{
  const q=m(),S={x:q.gc(0),y:q.tp(0)-56},pt=i=>({x:q.gc(i),y:q.tp(i)}),E={x:q.ex,y:q.yc};
  /* rimbalzi: P (0), E di piccole (6), I di ricerche (9), ultima E (15) */
  const seq=[[S,pt(0),450,0,.5,.5],[pt(0),pt(4),520,26,.5,.5],[pt(4),pt(7),520,26,.5,.5],[pt(7),pt(12),520,26,.5,.5],[pt(12),E,620,14,.5,1]],path=[];
  for(let p=0;p<3;p++){path.push(...seq);if(p<2)path.push([E,S,800,30,1,.5])}
  let i=0,s=performance.now();dot.style.transform=`translate(${S.x}px,${S.y}px) scale(.5)`;dot.style.opacity=1;
  const settle=()=>{h1.style.transition='padding-left .6s ease';dot.style.transition='transform .6s ease';requestAnimationFrame(()=>{h1.style.paddingLeft='0px';dot.style.transform=`translate(${E.x-q.pad}px,${q.yc}px)`;done=true})};
  const tick=now=>{
   if(!h1.isConnected)return;
   const [a,b,d,h,sa,sb]=path[i],u=Math.min(1,(now-s)/d);
   dot.style.transform=`translate(${a.x+(b.x-a.x)*u}px,${a.y+(b.y-a.y)*u-4*h*u*(1-u)}px) scale(${sa+(sb-sa)*u})`;
   if(u>=1){i++;s=now;if(i>=path.length)return settle()}
   requestAnimationFrame(tick)};
  requestAnimationFrame(tick);
 });
}
function initSim(){const tok=(window.__simTok=(window.__simTok||0)+1);
const S=.8,OX=110,OY=170,K=.866;
const pr=(x,y,z)=>[OX+(x-y)*K*S,OY+(x+y)*.5*S-z*S];
const pt=a=>a.map(p=>p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ');
const R=(a,b,c,d)=>[[a,b],[c,b],[c,d],[a,d]];
const CL={a:'#ffffff',b:'#a8a8a8',s:'#ffcf70',m:'#666666'};
function sol(prof,z0,z1,o,c){const[dx,dy,dz]=o||[0,0,0],P=prof.map(p=>[p[0]+dx,p[1]+dy]),f=[],b=[];
 let A=0;P.forEach((p,i)=>{const q=P[(i+1)%P.length];A+=p[0]*q[1]-q[0]*p[1]});const g=A<0?-1:1;
 f.push(P.map(p=>pr(p[0],p[1],z1+dz)));b.push(P.map(p=>pr(p[0],p[1],z0+dz)));
 P.forEach((p,i)=>{const q=P[(i+1)%P.length],n=(q[1]-p[1])*g+(p[0]-q[0])*g;
  (n>0?f:b).push([pr(p[0],p[1],z0+dz),pr(q[0],q[1],z0+dz),pr(q[0],q[1],z1+dz),pr(p[0],p[1],z1+dz)])});
 return{f,b,c:CL[c]}}
function ren(L,ex,lb){let s='';
 L.forEach(o=>o.b.forEach(p=>s+=`<polygon points="${pt(p)}" style="fill:none;stroke:${o.c};stroke-width:.8;stroke-dasharray:3 3;opacity:.4"/>`));
 L.forEach(o=>o.f.forEach(p=>s+=`<polygon points="${pt(p)}" style="fill:rgba(255,255,255,.07);stroke:${o.c};stroke-width:1.3;stroke-linejoin:round"/>`));
 (lb||[]).forEach(([t,x,y,z,tx,ty])=>{const p=pr(x,y,z);s+=`<path d="M${p[0]} ${p[1]}L${tx} ${ty}" style="stroke:#8a8a8a;stroke-width:.8"/><circle cx="${p[0]}" cy="${p[1]}" r="2.2" fill="#8a8a8a"/><text x="${tx}" y="${ty-4}" font-size="13" style="fill:#f2f2f2">${t}</text>`});
 return `<rect x="4" y="4" width="492" height="372" style="fill:none;stroke:#8a8a8a;stroke-width:.8"/>`+(ex||'')+s+`<text x="16" y="364" font-size="12" font-style="italic" style="fill:#aaaaaa">Axonometric view</text>`}
const gd=(x,y,z,az)=>{const a=pr(x,y,z),b=pr(x,y,z+az);return `<path d="M${a[0]} ${a[1]}L${b[0]} ${b[1]}" style="stroke:#ffcf70;stroke-width:.9;stroke-dasharray:5 4"/>`};

     else{p.s=1;p.t=0;if(M&&o.m&&!p.k)p.c=1;const jt=C.jet*wf*(.8+Math.random()*.4);p.vx=n[0]*jt+(n[0]?0:p.vx*.3);p.vy=n[1]*jt+(n[1]?0:p.vy*.3)}}}
   else if(p.s==1){const f=fld(p.x,p.y),kf=C.kf*(p.k==2?.8:1);
    p.vx+=(f[0]*sp-p.vx)*kf+(Math.random()-.5)*nz;p.vy+=(f[1]*sp-p.vy)*kf+(Math.random()-.5)*nz-by+(p.k==2?C.st||0:0);
    let qx=p.x+p.vx,qy=p.y+p.vy;
    for(const o of F.OB)if(qx>o[0]-3&&qx<o[2]+3&&qy>o[1]-3&&qy<o[3]+3){if(p.x>o[0]-3&&p.x<o[2]+3){p.vy*=-.4;qy=p.y}else{p.vx*=-.4;qx=p.x}}
    let ex=null;
    if(qx<xl){const o=hit('L',qy);if(o&&o.t=='out')ex='L';else{qx=xl;p.vx=Math.abs(p.vx)*.4}}
    if(qx>xr){const o=hit('R',qy);if(o&&o.t=='out')ex='R';else{qx=xr;p.vx=-Math.abs(p.vx)*.4}}
    if(qy<yt){const o=hit('T',qx);if(o&&o.t=='out')ex='T';else{qy=yt;p.vy=Math.abs(p.vy)*.4}}
    if(qy>yb){const o=hit('B',qx);if(o&&o.t=='out')ex='B';else{qy=yb;p.vy=-Math.abs(p.vy)*.4}}
    p.x=qx;p.y=qy;
    if(ex){p.s=2;p.t=0;const n=NRM[ex],m=Math.max(sp,Math.hypot(p.vx,p.vy));p.vx=-n[0]*m+(n[0]?0:p.vx*.3);p.vy=-n[1]*m+(n[1]?0:p.vy*.3)}
    else if(p.t>C.life)p.s=4}
   else if(p.s==2){p.x+=p.vx;p.y+=p.vy;if(p.x<-20||p.x>W+20||p.y<-20||p.y>H+20)p.a=0}
   else if(p.s==3){if(p.t>500)p.a-=.02}
   else if(p.s==4){p.a-=.02;p.x+=p.vx*.3;p.y+=p.vy*.3}}
  ps=ps.filter(p=>p.a>0);
  if(tick%20==0){hist.push(inside());if(hist.length>120)hist.shift()}}
 const inside=()=>{let n=0;for(const p of ps)if(p.s==1&&p.k)n++;return n};
 const clean=()=>{let n=0;for(const p of ps)if(p.s==1&&p.c)n++;return n};
 function wall(w){const [x0,y0,x1,y1]=C.room,vert=w=='L'||w=='R',c=w=='L'?x0:w=='R'?x1:w=='T'?y0:y1,lo=(vert?y0:x0)-HW,hi=(vert?y1:x1)+HW;
  const os=C.op.filter(o=>o.w==w).sort((a,b)=>a.a-b.a);let s=lo;const rc=(a,b)=>{if(b>a)vert?X.fillRect(c-HW,a,T,b-a):X.fillRect(a,c-HW,b-a,T)};
  for(const o of os){rc(s,o.a);s=o.b}rc(s,hi)}
 function draw(){const [x0,y0,x1,y1]=C.room,M=mem();
  X.setTransform(DP*S,0,0,DP*S,0,0);
  X.fillStyle=TH.out;X.fillRect(0,0,W,H);X.fillStyle=TH.floor;X.fillRect(x0,y0,x1-x0,y1-y0);
  if(C.heat){const q=C.heat,g=X.createLinearGradient(0,q[1]-160,0,q[3]);g.addColorStop(0,'rgba(255,154,77,0)');g.addColorStop(1,'rgba(255,154,77,.25)');X.fillStyle=g;X.fillRect(q[0]-30,q[1]-160,q[2]-q[0]+60,q[3]-q[1]+160);X.fillStyle=TH.heat;X.fillRect(q[0],q[1],q[2]-q[0],q[3]-q[1])}
  if(P.arrows){X.strokeStyle=TH.arrow;X.lineWidth=1.6;X.lineCap='round';X.lineJoin='round';X.stroke(F.AR)}
  X.fillStyle=TH.obs;for(const o of C.obs2||[])X.fillRect(o[0],o[1],o[2]-o[0],o[3]-o[1]);
  X.fillStyle=TH.wall;for(const w of['L','R','T','B'])wall(w);
  if(M)for(const o of C.op)if(o.m){const vert=o.w=='L'||o.w=='R',c=o.w=='L'?x0:o.w=='R'?x1:o.w=='T'?y0:y1;X.fillStyle=TH.mem;
   vert?X.fillRect(c-HW-3,o.a,T+6,o.b-o.a):X.fillRect(o.a,c-HW-3,o.b-o.a,T+6);X.strokeStyle=TH.memEdge;X.lineWidth=1;X.beginPath();for(const f of F.fib[o.w+o.a]){X.moveTo(f[0],f[1]);X.lineTo(f[2],f[3])}X.stroke()}
  const col=[TH.air,TH.poll,TH.coarse];
  for(const p of ps){const r=RAD[p.k],cl=p.k?col[p.k]:p.c?TH.clean:col[0];const al=Math.max(0,p.a)*(p.s==2?Math.max(.2,1-p.t/200):1);
   if(p.s!=3){X.strokeStyle=cl;X.globalAlpha=al*.35;X.lineWidth=r*.9;X.beginPath();X.moveTo(p.x-p.vx*5,p.y-p.vy*5);X.lineTo(p.x,p.y);X.stroke()}
   X.globalAlpha=al;X.fillStyle=cl;X.beginPath();X.arc(p.x,p.y,r,0,7);X.fill()}
  X.globalAlpha=1;const fs=Math.max(22,11/S);X.font='600 '+fs+'px Futura,"Futura PT","Century Gothic",Jost,"Trebuchet MS",sans-serif';X.textBaseline='middle';X.lineJoin='round';X.lineWidth=fs*.3;X.strokeStyle=TH.halo;
  for(const l of C.lb){if(l[4]&&!M)continue;X.fillStyle=l[2]=='Floor'?TH.muted:TH.label;X.textAlign=l[3]||'left';X.strokeText(l[2],l[0],l[1]);X.fillText(l[2],l[0],l[1])}}
 return{load,reset,step,draw,size,inside,clean,hist:()=>hist,get cap(){return cap}}}

/* ---------- UI ---------- */
const $=id=>document.getElementById(id);
const A=makeSim($('cvA'),false),B=makeSim($('cvB'),true);
const tabs=$('tabs');
for(const k in CONF){const b=document.createElement('button');b.type='button';b.className='tab';b.dataset.k=k;b.id='tab-'+k;
 b.innerHTML=CONF[k].tab+'<small>'+CONF[k].view+'</small>';b.setAttribute('aria-pressed',k==P.cfg);b.onclick=()=>setCfg(k);tabs.appendChild(b)}
function warm(n){for(let i=0;i<n;i++){A.step();if(P.compare)B.step()}}
function setCfg(k){P.cfg=k;for(const b of tabs.children)b.setAttribute('aria-pressed',b.dataset.k==k);
 const c=CONF[k];A.load(k);B.load(k);warm(250);
 $('cfgName').textContent=c.name;$('cfgText').textContent=c.text;$('cfgObs').innerHTML=c.obs.map(o=>'<li>'+o+'</li>').join('');
 $('capA').textContent=c.view+(P.compare?' · with membrane':'');
 $('windLbl').textContent=k=='stack'?'Temperature difference':'Wind';updWind();drawAll();updStats()}
function updWind(){const v=P.wind,st=P.cfg=='stack';$('windVal').textContent=(v<.8?(st?'low':'weak'):v<1.4?(st?'medium':'moderate'):(st?'high':'strong'))+' · ×'+v.toFixed(1)}
function updPoll(){const v=P.poll;$('pollVal').textContent=(v<.25?'low':v<.45?'medium':'high')+' · '+Math.round(v*100)+'% particles'}
$('wind').oninput=e=>{P.wind=+e.target.value;updWind()};
$('poll').oninput=e=>{P.poll=+e.target.value;updPoll()};
$('mem').onchange=e=>{P.membrane=e.target.checked;$('grade').classList.toggle('off',!P.membrane);A.reset();warm(250);drawAll()};
for(const b of $('grade').children)b.onclick=()=>{P.grade=b.dataset.g;for(const x of $('grade').children)x.setAttribute('aria-pressed',x===b)};
$('arrows').onchange=e=>{P.arrows=e.target.checked;drawAll()};
$('cmp').onchange=e=>{P.compare=e.target.checked;$('figB').hidden=!P.compare;$('canvases').classList.toggle('compare',P.compare);$('sInBRow').hidden=!P.compare;
 $('mem').disabled=P.compare;$('grade').classList.toggle('off',!P.compare&&!P.membrane);
 A.reset();B.reset();warm(250);$('capA').textContent=CONF[P.cfg].view+(P.compare?' · with membrane':'');resize()};
$('play').onclick=()=>{P.paused=!P.paused;$('play').textContent=P.paused?'Resume':'Pause'};
$('restart').onclick=()=>{A.reset();B.reset();drawAll();updStats()};

/* sparkline */
const sp=$('spark'),SX=sp.getContext('2d');
function drawSpark(){const w=sp.clientWidth,h=sp.clientHeight,d=Math.min(2,devicePixelRatio||1);if(sp.width!==Math.round(w*d)){sp.width=Math.round(w*d);sp.height=Math.round(h*d)}
 SX.setTransform(d,0,0,d,0,0);SX.clearRect(0,0,w,h);const ha=A.hist(),hb=P.compare?B.hist():[];const mx=Math.max(10,...ha,...hb);
 SX.strokeStyle=TH.line;SX.lineWidth=1;for(const f of[0,.5,1]){const y=4+(h-18)*(1-f);SX.beginPath();SX.moveTo(0,y+.5);SX.lineTo(w,y+.5);SX.stroke()}
 SX.fillStyle=TH.muted;SX.font='11px Futura,"Century Gothic",Jost,sans-serif';SX.textBaseline='top';SX.textAlign='right';SX.fillText(String(mx),w-2,6);
 const line=(hs,c,fill)=>{if(hs.length<2)return;SX.beginPath();hs.forEach((v,i)=>{const x=i/119*w,y=4+(h-18)*(1-v/mx);i?SX.lineTo(x,y):SX.moveTo(x,y)});
  if(fill){SX.save();SX.lineTo((hs.length-1)/119*w,h-14);SX.lineTo(0,h-14);SX.closePath();SX.globalAlpha=.12;SX.fillStyle=c;SX.fill();SX.restore();SX.beginPath();hs.forEach((v,i)=>{const x=i/119*w,y=4+(h-18)*(1-v/mx);i?SX.lineTo(x,y):SX.moveTo(x,y)})}
  SX.strokeStyle=c;SX.lineWidth=2;SX.stroke();const i=hs.length-1;SX.fillStyle=c;SX.beginPath();SX.arc(i/119*w,4+(h-18)*(1-hs[i]/mx),3,0,7);SX.fill()};
 if(P.compare)line(hb,TH.poll,false);line(ha,P.compare||P.membrane?TH.clean:TH.poll,true);
 $('sparkKey').textContent=P.compare?'white: with · amber: without':''}
function updStats(){$('sCap').textContent=A.cap;$('sIn').textContent=A.inside();$('sClean').textContent=A.clean();$('sInB').textContent=B.inside();
 $('capA2').textContent=A.inside()+' pollutants';$('capB2').textContent=B.inside()+' pollutants';drawSpark()}
function drawAll(){A.draw();if(P.compare)B.draw()}
function resize(){A.size();B.size();drawAll();M.size();M.draw();drawSpark()}

/* ---------- micro simulation: fibres in section ---------- */
const M=(function(){const cv=$('mcv'),X=cv.getContext('2d'),MW=914,MH=520,BX0=340,BX1=580,TOP=50,BOT=470;
 let S=1,DP=1,FB=[],ps=[],st=[],rings=[],cnt,sd=5,U0=1.5,nF=20;
 const R=()=>(sd=(sd*16807)%2147483647)/2147483647;
 const RAD=[1.8,7,4,2.4],KF=[.6,.03,.35,.45],NZ=[.15,0,.04,1.4];
 function gen(){sd=5;FB=[];const gap=nF>24?14:nF>16?24:36;for(let n=0;FB.length<nF&&n<5000;n++){const r=14+R()*12,x=BX0+r+R()*(BX1-BX0-2*r),y=TOP+r+R()*(BOT-TOP-2*r);
  if(FB.every(f=>Math.hypot(f[0]-x,f[1]-y)>f[2]+r+gap))FB.push([x,y,r])}reset()}
 function reset(){ps=[];st=[];rings=[];cnt=[[0,0],[0,0],[0,0],[0,0]]}
 function fld(x,y){let u=U0,v=0;for(const f of FB){const dx=x-f[0],dy=y-f[1],r2=dx*dx+dy*dy,R2=f[2]*f[2];if(r2>R2*25||r2<1)continue;
  const q=R2/(r2*r2);u-=U0*q*(dx*dx-dy*dy);v-=U0*q*2*dx*dy}return[u,v]}
 function step(){for(let i=0;i<2;i++)if(Math.random()<.4*U0/1.5+.15){const r=Math.random(),k=r<.55?0:r<.68?1:r<.84?2:3;ps.push({x:-10,y:TOP-20+Math.random()*(BOT-TOP+40),vx:U0,vy:0,k,c:0,d:0})}
  for(const p of ps){const f=fld(p.x,p.y);p.vx+=(f[0]-p.vx)*KF[p.k]+(Math.random()-.5)*NZ[p.k];p.vy+=(f[1]-p.vy)*KF[p.k]+(Math.random()-.5)*NZ[p.k];
   if(p.k==3){p.vx=Math.max(-1,Math.min(3.5,p.vx));p.vy=Math.max(-2,Math.min(2,p.vy))}
   p.x+=p.vx;p.y+=p.vy;
   for(const fb of FB){const dx=p.x-fb[0],dy=p.y-fb[1],d=Math.hypot(dx,dy),lim=fb[2]+RAD[p.k];
    if(d<lim){if(p.k){p.d=1;cnt[p.k][0]++;const px=fb[0]+dx/d*lim,py=fb[1]+dy/d*lim;st.push([px,py,p.k]);rings.push([px,py,p.k,0]);break}
     else{p.x=fb[0]+dx/d*lim;p.y=fb[1]+dy/d*lim}}}
   if(!p.c&&p.x>BX1+10){p.c=1;if(p.k)cnt[p.k][1]++}
   if(p.x>MW+10||p.y<-20||p.y>MH+20)p.d=1}
  ps=ps.filter(p=>!p.d);if(st.length>260)st.splice(0,st.length-260);
  for(const r of rings)r[3]++;rings=rings.filter(r=>r[3]<40)}
 function size(){const w=cv.clientWidth||600;DP=Math.min(2,devicePixelRatio||1);cv.width=Math.round(w*DP);cv.height=Math.round(w*MH/MW*DP);S=w/MW}
 function draw(){X.setTransform(DP*S,0,0,DP*S,0,0);const col=[TH.air,TH.coarse,TH.poll,TH.ultra];
  X.fillStyle=TH.out;X.fillRect(0,0,MW,MH);X.fillStyle=TH.band;X.fillRect(BX0-20,0,BX1-BX0+40,MH);X.fillStyle=TH.floor;X.fillRect(BX1+20,0,MW-BX1-20,MH);
  for(const f of FB){X.fillStyle=TH.mem;X.strokeStyle=TH.memEdge;X.lineWidth=2;X.beginPath();X.arc(f[0],f[1],f[2],0,7);X.fill();X.stroke();
   X.fillStyle='rgba(255,255,255,.45)';X.beginPath();X.arc(f[0]-f[2]*.35,f[1]-f[2]*.35,f[2]*.35,0,7);X.fill()}
  for(const s of st){X.fillStyle=col[s[2]];X.beginPath();X.arc(s[0],s[1],RAD[s[2]],0,7);X.fill()}
  for(const r of rings){X.strokeStyle=col[r[2]];X.globalAlpha=1-r[3]/40;X.lineWidth=2.5;X.beginPath();X.arc(r[0],r[1],RAD[r[2]]+4+r[3]*.5,0,7);X.stroke()}X.globalAlpha=1;
  for(const p of ps){const c=p.k?col[p.k]:p.x>BX1+10?TH.clean:col[0];X.strokeStyle=c;X.globalAlpha=.3;X.lineWidth=RAD[p.k];X.beginPath();X.moveTo(p.x-p.vx*4,p.y-p.vy*4);X.lineTo(p.x,p.y);X.stroke();
   X.globalAlpha=1;X.fillStyle=c;X.beginPath();X.arc(p.x,p.y,RAD[p.k],0,7);X.fill()}}
 function stats(){for(let k=1;k<4;k++){const t=cnt[k][0]+cnt[k][1],pc=t?Math.round(cnt[k][0]/t*100):0;$('m'+k).textContent=pc+'%';$('b'+k).style.width=pc+'%'}}
 return{gen,reset,step,size,draw,stats,setU:v=>{U0=v},setN:n=>{nF=n;gen()}}})();
$('mspeed').oninput=e=>{M.setU(+e.target.value);M.reset();updMs()};
function updMs(){const v=+$('mspeed').value;$('mspeedVal').textContent=(v<1.2?'slow':v<2?'medium':'fast')+' · ×'+v.toFixed(1)}
for(const b of $('mdens').children)b.onclick=()=>{for(const x of $('mdens').children)x.setAttribute('aria-pressed',x===b);M.setN(+b.dataset.d);for(let i=0;i<400;i++)M.step()};

/* ---------- start ---------- */
M.gen();for(let i=0;i<1400;i++)M.step();
setCfg('cross');warm(700);
updPoll();updMs();
if(matchMedia('(prefers-reduced-motion: reduce)').matches){P.paused=true;$('play').textContent='Resume'}
new ResizeObserver(resize).observe(document.querySelector('article'));
resize();updStats();M.stats();
let fr=0;
(function loop(){if(TOK!==window.__airTok||!document.getElementById('cvA'))return;if(!P.paused){A.step();if(P.compare)B.step();M.step();drawAll();M.draw();if(++fr%10==0){updStats();M.stats()}}requestAnimationFrame(loop)})();

}
function project(id){
 const i=PROJECTS.findIndex(p=>p.id===id);if(i<0)return home();
 const p=PROJECTS[i],pr=PROJECTS[i-1],nx=PROJECTS[i+1];
 if(p.tpl||p.parts){const T=id=>document.getElementById(id).innerHTML;const body=p.parts?p.parts.map(([k,id])=>k=='raw'?T(id):`<div class="prose">${T(id)}</div>`).join(''):`<div class="prose">${T(p.tpl)}</div>${p.sim?`<section class="sim" aria-label="Interactive simulator">${T(p.sim)}</section>`:''}${p.tpl2?`<div class="prose">${T(p.tpl2)}</div>`:''}`;app.innerHTML=`<article class="oo"><a class="back" href="#/">All research</a><h1 class="ttl">${p.title}</h1><p class="sub">${p.sub}</p><div class="meta">${p.year}, ${p.tags.join(', ')}</div>${body}<div class="pn"><span>${pr?`<a href="#/p/${pr.id}">${pr.title}</a>`:''}</span><span style="text-align:right">${nx?`<a href="#/p/${nx.id}">${nx.title}</a>`:''}</span></div></article>`;if(p.init)p.init();else if(p.sim)initSim();return}
 app.innerHTML=`<article><a class="back" href="#/">All research</a><h1>${p.title}</h1><div class="meta">${p.year}, ${p.tags.join(', ')}</div><div class="body">${p.body.slice(0,1).map(t=>`<p>${t}</p>`).join('')}</div><section class="tool" aria-label="Interactive tool"><h2>Tool</h2><div id="tool"></div></section><div class="body">${p.body.slice(1).map(t=>`<p>${t}</p>`).join('')}</div><div class="pn"><span>${pr?`<a href="#/p/${pr.id}">${pr.title}</a>`:''}</span><span style="text-align:right">${nx?`<a href="#/p/${nx.id}">${nx.title}</a>`:''}</span></div></article>`;
 p.tool(document.getElementById('tool'));
}
function info(){app.innerHTML=`<article class="infopage"><div><a class="back" href="#/">All research</a><h1 class="ttl">Information</h1></div><div class="infotext">${INFO.map((t,i)=>i?`<p>${t}</p>`:`<h2 class="hello" aria-label="${t}">${t.replace(/!$/,'')}<span class="excl" aria-hidden="true"><i class="bar"></i><i class="ball"></i></span></h2>`).join('')}</div></article>`}
function route(){const h=location.hash.replace(/^#\/?/,'');window.scrollTo(0,0);if(h.startsWith('p/'))project(h.slice(2));else if(h==='info')info();else home()}
window.addEventListener('hashchange',route);route();
</script>
